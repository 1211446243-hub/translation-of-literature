<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SolarSystem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="orbit"></span>
    <span class="orbit orbit-inner"></span>
  </div>
  <header>
    <div class="masthead">
      <div>
        <p class="kicker" data-i18n="kicker">观测记录</p>
        <h1>SolarSystem</h1>
        <p class="tagline" data-i18n="tagline">科学文档译成另一种语言，译文仍留在原来的位置。</p>
      </div>
      <button id="open-settings" type="button" data-i18n="settings">设置</button>
    </div>
  </header>
  <aside id="api-notice">
    <p data-i18n="api_notice">服务器尚未开通。请打开设置，填写自己的 API 后再翻译。</p>
    <button id="close-api-notice" type="button" data-i18n="notice_close">关闭</button>
  </aside>
  <dialog id="settings" aria-labelledby="settings-heading">
    <div id="settings-menu">
      <h2 id="settings-heading" data-i18n="settings">设置</h2>
      <button id="open-model" class="settings-option" type="button">
        <span data-i18n="model">模型</span>
      </button>
      <button id="switch-language" class="settings-option" type="button">
        <span data-i18n="language">语言</span>
        <span class="settings-option-aside" data-i18n="language_switch">English</span>
      </button>
      <p class="actions">
        <button id="close-settings" type="button" data-i18n="settings_done">完成</button>
      </p>
    </div>
    <form id="model-form" hidden>
      <h2 data-i18n="model">模型</h2>
      <p>
        <label for="base-url" data-i18n="base_url">服务地址</label>
        <input id="base-url" name="base_url" type="url" autocomplete="off" data-i18n-placeholder="base_url_placeholder" placeholder="https://api.deepseek.com">
      </p>
      <p>
        <label for="api-key" data-i18n="api_key">API</label>
        <input id="api-key" name="api_key" type="password" autocomplete="off" data-i18n-placeholder="api_key_placeholder" placeholder="填入 API">
      </p>
      <p id="api-key-set" hidden data-i18n="api_key_set">已保存，留空则继续使用</p>
      <p>
        <label for="model" data-i18n="model_name">模型名称</label>
        <input id="model" name="model" type="text" autocomplete="off" data-i18n-placeholder="model_placeholder" placeholder="deepseek-flash">
      </p>
      <p id="config-status" role="status"></p>
      <p class="actions">
        <button id="save-config" type="submit" data-i18n="save_config">保存</button>
        <button id="settings-back" type="button" data-i18n="settings_back">返回</button>
      </p>
    </form>
  </dialog>
  <main>
    <section class="task-column" aria-labelledby="task-heading">
      <h2 id="task-heading" data-i18n="task_heading">翻译任务</h2>
      <form id="task-form">
        <fieldset>
          <legend data-i18n="source_kind">来源</legend>
          <label>
            <input type="radio" name="source-kind" value="file" checked>
            <span data-i18n="source_file">本地文件</span>
          </label>
          <label>
            <input type="radio" name="source-kind" value="link">
            <span data-i18n="source_link">链接</span>
          </label>
        </fieldset>
        <p id="file-field">
          <label for="file-input" data-i18n="file_label">选择 PDF、DOC 或 DOCX</label>
          <input id="file-input" name="file" type="file" accept=".pdf,.doc,.docx,application/pdf">
        </p>
        <p id="link-field" hidden>
          <label for="link-input" data-i18n="link_label">文件链接</label>
          <input id="link-input" name="link" type="url" data-i18n-placeholder="link_placeholder" placeholder="http 或 https 链接">
        </p>
        <p>
          <label for="lang-in" data-i18n="lang_in">源语言</label>
          <select id="lang-in" name="lang_in">
            <option value="zh">简体中文</option>
            <option value="zh-TW">繁体中文</option>
            <option value="en" selected>英语</option>
            <option value="fr">法语</option>
            <option value="de">德语</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
            <option value="ru">俄语</option>
            <option value="es">西班牙语</option>
            <option value="it">意大利语</option>
          </select>
        </p>
        <p>
          <label for="lang-out" data-i18n="lang_out">目标语言</label>
          <select id="lang-out" name="lang_out">
            <option value="zh" selected>简体中文</option>
            <option value="zh-TW">繁体中文</option>
            <option value="en">英语</option>
            <option value="fr">法语</option>
            <option value="de">德语</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
            <option value="ru">俄语</option>
            <option value="es">西班牙语</option>
            <option value="it">意大利语</option>
          </select>
        </p>
        <p>
          <label for="pages" data-i18n="pages_label">页码范围</label>
          <select id="pages" name="pages">
            <option value="all" data-i18n="pages_all">全部</option>
            <option value="1" data-i18n="pages_first">第一页</option>
            <option value="1-5" data-i18n="pages_five">前五页</option>
            <option value="custom" data-i18n="pages_custom">自定义</option>
          </select>
        </p>
        <p id="pages-custom-row" hidden>
          <label for="pages-custom" data-i18n="pages_custom_label">自定义页码，例如 1,3-5</label>
          <input id="pages-custom" type="text">
        </p>
        <details>
          <summary data-i18n="advanced">高级项</summary>
          <p>
            <label for="thread" data-i18n="thread">线程数</label>
            <input id="thread" name="thread" type="number" min="1" value="4">
          </p>
          <p>
            <label>
              <input id="ignore-cache" name="ignore_cache" type="checkbox">
              <span data-i18n="ignore_cache">忽略缓存</span>
            </label>
          </p>
          <p>
            <label>
              <input id="skip-subset" name="skip_subset_fonts" type="checkbox">
              <span data-i18n="skip_subset">跳过字体子集</span>
            </label>
          </p>
          <p>
            <label for="formula-font" data-i18n="formula_font">公式字体正则</label>
            <input id="formula-font" name="formula_font" type="text">
          </p>
          <p>
            <label for="formula-char" data-i18n="formula_char">公式字符正则</label>
            <input id="formula-char" name="formula_char" type="text">
          </p>
          <p>
            <label for="prompt" data-i18n="prompt">自定义提示词</label>
            <textarea id="prompt" name="prompt"></textarea>
          </p>
        </details>
        <p class="actions">
          <button id="start" type="button" data-i18n="start">开始</button>
          <button id="cancel" type="button" data-i18n="cancel">取消</button>
        </p>
        <p id="progress" role="status" data-idle="1">尚未开始</p>
      </form>
    </section>
    <section class="preview-column" aria-labelledby="preview-heading">
      <h2 id="preview-heading" data-i18n="preview_heading">预览</h2>
      <iframe id="preview" title="预览"></iframe>
      <p class="downloads">
        <a id="download-mono" href="" hidden data-i18n="download_mono">下载译文 PDF</a>
        <a id="download-dual" href="" hidden data-i18n="download_dual">下载对照 PDF</a>
      </p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
